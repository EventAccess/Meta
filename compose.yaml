services:
  web:
    build: ./
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/usr/src/Registrering
    ports:
      - "8000:8000"
    env_file:
      - ./dev.env
    depends_on:
      - Database
  Database:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data:


