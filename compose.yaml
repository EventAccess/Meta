services:
  web:
    build: ./
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/usr/src/Registrering
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - database
  database:
    image: postgres:17
    env_file: .env
    shm_size: 256MB
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data:


